<!doctype html><meta charset="utf-8"><title>motion-defined text</title>
<style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style>
<canvas id="c" width="960" height="540"></canvas>
<script>
// Client: receives occupancy bitmaps and paints dots. It never has the question text, the mask, or any dot identity/velocity.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GS = 2;
const img = ctx.createImageData(W, H), px = new Uint32Array(img.data.buffer);
const WHITE = 0xffffffff, BLACK = 0xff000000;
let GW = 480, GH = 270, ring = [], K = 30, drawMs = [], frames = 0, ended = null, hello = null;
window.__q = { get frames() { return frames; }, get ended() { return ended; }, get hello() { return hello; }, get drawMs() { return drawMs; } };
async function inflate(u8) { const ds = new DecompressionStream('deflate-raw'); const r = new Response(new Blob([u8]).stream().pipeThrough(ds)); return new Uint8Array(await r.arrayBuffer()); }
function paint(bits) {
  const t = performance.now(); px.fill(BLACK);
  for (let c = 0; c < GW * GH; c++) if (bits[c >> 3] & (1 << (c & 7))) { const gx = c % GW, gy = (c / GW) | 0; const o = gy * GS * W + gx * GS; px[o] = px[o + 1] = px[o + W] = px[o + W + 1] = WHITE; }
  ctx.putImageData(img, 0, 0);
  // keep the last K canvas frames (1 byte/pixel) so the harness can compute averages/max-projections of what is ON THE CANVAS
  const g = new Uint8Array(W * H); for (let i = 0; i < g.length; i++) g[i] = px[i] === WHITE ? 255 : 0;
  ring.push(g); if (ring.length > K) ring.shift();
  drawMs.push(performance.now() - t);
}
// window.__capture(mode, n) -> dataURL of single / avg / max over the last n canvas frames
window.__capture = (mode, n) => {
  const fr = ring.slice(-n); const out = new Uint8ClampedArray(W * H * 4);
  for (let i = 0; i < W * H; i++) {
    let v;
    if (mode === 'max') { v = 0; for (const f of fr) if (f[i] > v) v = f[i]; }
    else { let s = 0; for (const f of fr) s += f[i]; v = s / fr.length; }
    out[i * 4] = out[i * 4 + 1] = out[i * 4 + 2] = v; out[i * 4 + 3] = 255;
  }
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; c2.getContext('2d').putImageData(new ImageData(out, W, H), 0, 0);
  return c2.toDataURL('image/png');
};
window.__single = () => cv.toDataURL('image/png');
window.__start = (start) => new Promise((res) => {
  const ws = new WebSocket(`ws://${location.host}/ws`); ws.binaryType = 'arraybuffer'; let wire = 0;
  ws.onopen = () => ws.send(JSON.stringify({ start }));
  ws.onmessage = async (e) => {
    if (typeof e.data === 'string') { const m = JSON.parse(e.data); if (m.hello) { hello = m.hello; GW = m.hello.gw; GH = m.hello.gh; } if (m.end) { ended = { ...m.end, clientWire: wire }; res(ended); } return; }
    wire += e.data.byteLength; const u8 = new Uint8Array(e.data); const bits = await inflate(u8.subarray(5)); paint(bits); frames++;
  };
});
const p = new URLSearchParams(location.search); if (p.get('demo')) window.__start({ q: 'Which planet is known as the Red Planet?', options: ['Venus', 'Mars', 'Jupiter', 'Mercury'], secs: 30 });
</script>
